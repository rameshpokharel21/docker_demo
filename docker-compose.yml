
services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s
  app:
    build: .
    container_name: spring_docker_demo
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "9090:8080"

volumes:
  pgdata: